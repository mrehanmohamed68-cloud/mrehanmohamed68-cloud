<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="712" height="172" rx="6" ry="6" fill="#0a0a0f" stroke="#0a0a0f" filter="url(#shadow)"/>

  <!-- Left column -->
  <g transform="translate(40,30)">
    <text x="0" y="0" fill="#ff4da6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="700">22</text>
    <text x="0" y="34" fill="#ff4da6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14">Total Contributions</text>
    <text x="0" y="62" fill="#00e5ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12">Jun 17 - Present</text>
  </g>

  <!-- Divider left -->
  <rect x="240" y="20" width="1" height="140" fill="#122026"/>

  <!-- Center column -->
  <g transform="translate(280,28)">
    <!-- Outer ring -->
    <circle cx="80" cy="40" r="34" fill="none" stroke="#00e5ff" stroke-width="6" />
    <!-- inner number -->
    <text x="80" y="48" text-anchor="middle" fill="#ffd966" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="700">1</text>
    <!-- flame icon (small) -->
    <path d="M80 6c-4 6-8 8-8 14a8 8 0 0016 0c0-6-4-8-8-14z" fill="#00e5ff" transform="translate(0,0) scale(1.2) translate(-8,-6)" />
    <text x="80" y="96" text-anchor="middle" fill="#00e5ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700">Current Streak</text>
    <text x="80" y="116" text-anchor="middle" fill="#cfd8dc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12">Aug 17</text>
  </g>

  <!-- Divider right -->
  <rect x="480" y="20" width="1" height="140" fill="#122026"/>

  <!-- Right column -->
  <g transform="translate(520,30)">
    <text x="0" y="0" fill="#ff4da6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="700">2</text>
    <text x="0" y="34" fill="#ff4da6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14">Longest Streak</text>
    <text x="0" y="62" fill="#00e5ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12">Aug 11 - Aug 12</text>
  </g>

</svg>
