<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer card -->
  <rect x="20" y="20" width="1160" height="260" rx="12" ry="12" fill="#0a0a0f" stroke="#0a0a0f" filter="url(#shadow)"/>

  <!-- Big top-left number -->
  <text x="70" y="90" fill="#ff4da6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="100" font-weight="900">22</text>

  <!-- Left column texts -->
  <g transform="translate(110,120)">
    <text x="0" y="0" fill="#ff4da6" font-size="22" font-weight="600">Total Contributions</text>
    <text x="0" y="36" fill="#00e5ff" font-size="16">Jun 17 - Present</text>
  </g>

  <!-- Big top-right number -->
  <text x="1080" y="90" fill="#ff4da6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="100" font-weight="900" text-anchor="end">2</text>

  <!-- Right column texts -->
  <g transform="translate(860,120)">
    <text x="0" y="0" fill="#ff4da6" font-size="22" font-weight="600">Longest Streak</text>
    <text x="0" y="36" fill="#00e5ff" font-size="16">Aug 11 - Aug 12</text>
  </g>

  <!-- Vertical dividers -->
  <rect x="420" y="40" width="2" height="200" fill="#122026"/>
  <rect x="780" y="40" width="2" height="200" fill="#122026"/>

  <!-- Center column (ring + flame + number) -->
  <g transform="translate(510,40)">
    <!-- Ring -->
    <circle cx="180" cy="120" r="70" fill="none" stroke="#00e5ff" stroke-width="14" />
    <!-- Flame (small) -->
    <path d="M180 48c-6 10-12 12-12 22a12 12 0 0024 0c0-10-6-12-12-22z" fill="#00e5ff" transform="translate(-12,-48) scale(1.05)" />
    <!-- Inner number -->
    <text x="180" y="130" text-anchor="middle" fill="#ffd966" font-size="44" font-weight="800">1</text>
    <!-- Current Streak label -->
    <text x="180" y="190" text-anchor="middle" fill="#00e5ff" font-size="28" font-weight="800">Current Streak</text>
    <text x="180" y="216" text-anchor="middle" fill="#cfd8dc" font-size="16">Aug 17</text>
  </g>

</svg>
