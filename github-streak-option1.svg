<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 900 220" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0b0c" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="12" y="10" width="876" height="200" rx="10" ry="10" fill="url(#bg1)" filter="url(#s)" />

  <!-- Left -->
  <g transform="translate(44,46)">
    <text x="0" y="0" fill="#ff4da6" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">22</text>
    <text x="0" y="62" fill="#ff4da6" font-family="Arial, Helvetica, sans-serif" font-size="14">Total Contributions</text>
    <text x="0" y="86" fill="#00e5ff" font-family="Arial, Helvetica, sans-serif" font-size="12">Jun 17 - Present</text>
  </g>

  <!-- Dividers -->
  <rect x="300" y="28" width="1" height="164" fill="#122026" />
  <rect x="640" y="28" width="1" height="164" fill="#122026" />

  <!-- Center -->
  <g transform="translate(320,12)">
    <circle cx="230" cy="100" r="54" fill="none" stroke="#00e5ff" stroke-width="10" />
    <circle cx="260" cy="70" r="10" fill="#00e5ff" />
    <text x="230" y="110" text-anchor="middle" fill="#ffd966" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">1</text>
    <text x="230" y="150" text-anchor="middle" fill="#00e5ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Current Streak</text>
    <text x="230" y="174" text-anchor="middle" fill="#cfd8dc" font-family="Arial, Helvetica, sans-serif" font-size="12">Aug 17</text>
  </g>

  <!-- Right -->
  <g transform="translate(660,46)">
    <text x="0" y="0" fill="#ff4da6" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">2</text>
    <text x="0" y="62" fill="#ff4da6" font-family="Arial, Helvetica, sans-serif" font-size="14">Longest Streak</text>
    <text x="0" y="86" fill="#00e5ff" font-family="Arial, Helvetica, sans-serif" font-size="12">Aug 11 - Aug 12</text>
  </g>

</svg>
